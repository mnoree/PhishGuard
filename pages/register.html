<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — PhishGuard</title><link rel="stylesheet" href="../css/styles.css"></head><body class="auth-page"><main class="auth-card"><div class="brand">PHISH<span>GUARD</span></div><div class="auth-head"><h1>Create your account</h1><p>Register as a trainee. Administrator accounts are managed separately.</p></div><form id="registerForm"><div class="form-group"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" required></div><div class="form-group"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" required></div><div class="form-group"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" minlength="8" required></div><div class="form-group"><label class="form-label" for="confirm">Confirm password</label><input class="form-control" id="confirm" type="password" required></div><p id="message" class="error" hidden></p><button class="btn btn-primary" style="width:100%" type="submit">Create account</button></form><div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div></main><script src="../js/data-store.js"></script><script src="../data/demo-data.js"></script><script src="../js/auth.js"></script><script>registerForm.addEventListener('submit',function(e){e.preventDefault();message.hidden=true;if(password.value!==confirm.value){message.textContent='Passwords do not match.';message.hidden=false;return}if(PGStore.getUserByEmail(email.value)){message.textContent='An account with this email already exists.';message.hidden=false;return}const user={id:PGStore.id('usr'),role:'user',fullName:name.value.trim(),email:email.value.trim(),password:password.value,company:'',position:'Employee'};PGStore.setUsers([...PGStore.getUsers(),user]);PGAuth.login(user.email,user.password);location.href='user-dashboard.html'});</script></body></html>
