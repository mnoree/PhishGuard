<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — PhishGuard</title><link rel="stylesheet" href="../css/styles.css"></head><body class="auth-page"><main class="auth-card"><div class="brand">PHISH<span>GUARD</span></div><div class="auth-head"><h1>Reset your password</h1><p>For this academic demo, password recovery is simulated locally.</p></div><form id="resetForm"><div class="form-group"><label class="form-label" for="email">Account email</label><input class="form-control" id="email" type="email" required></div><div class="form-group"><label class="form-label" for="password">New password</label><input class="form-control" id="password" type="password" minlength="8" required></div><div class="form-group"><label class="form-label" for="confirm">Confirm password</label><input class="form-control" id="confirm" type="password" required></div><p id="message" class="error" hidden></p><button class="btn btn-primary" style="width:100%">Update password</button></form><div class="auth-footer"><a href="login.html">Back to login</a></div></main><script src="../js/data-store.js"></script><script src="../data/demo-data.js"></script><script>resetForm.addEventListener('submit',function(e){e.preventDefault();message.hidden=true;const user=PGStore.getUserByEmail(email.value);if(!user){message.textContent='If an account exists for this email, the reset process can continue in the demo.';message.hidden=false;return}if(password.value!==confirm.value){message.textContent='Passwords do not match.';message.hidden=false;return}PGStore.updateUser(user.id,{password:password.value});alert('Password updated successfully.');location.href='login.html'});</script></body></html>
