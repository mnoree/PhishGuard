<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — PhishGuard</title><link rel="stylesheet" href="../css/styles.css"></head><body class="auth-page"><main class="auth-card"><div class="brand">PHISH<span>GUARD</span></div><div class="auth-head"><h1>Welcome back</h1><p>Sign in to continue to your security dashboard.</p></div><form id="loginForm"><div class="form-group"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" required autocomplete="email"></div><div class="form-group"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" required autocomplete="current-password"></div><p id="message" class="error" hidden></p><button class="btn btn-primary" style="width:100%" type="submit">Sign in</button></form><div class="auth-footer"><a href="reset-password.html">Forgot your password?</a><br><br>Don't have an account? <a href="register.html">Create one</a></div><div class="auth-footer" style="margin-top:28px;font-size:12px">Demo: admin@phishguard.demo / Admin123!<br>User: sara@phishguard.demo / User123!</div></main><script src="../js/data-store.js"></script><script src="../data/demo-data.js"></script><script src="../js/auth.js"></script><script src="../js/app.js"></script><script>document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();const m=document.getElementById('message');const r=PGAuth.login(email.value,password.value);if(!r.ok){m.textContent=r.message;m.hidden=false;return}PGAuth.redirectByRole(r.user)});</script></body></html>
